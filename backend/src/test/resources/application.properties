server.port=8081

# In-memory H2 Database for Automated Unit & Integration Tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Dummy Object Storage for Tests
aws.s3.endpoint=https://dummy-storage.neon.tech
aws.s3.access-key=dummy_nak_key
aws.s3.secret-key=dummy_nsk_key
aws.s3.region=us-east-2
aws.s3.bucket=photos

