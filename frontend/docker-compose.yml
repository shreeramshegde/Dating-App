services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
        - VITE_WS_URL=${VITE_WS_URL:-http://localhost:8080/ws}
    container_name: dating-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
