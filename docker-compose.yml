services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dating-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
        - VITE_WS_URL=${VITE_WS_URL:-http://localhost:8080/ws}
    container_name: dating-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    env_file:
      - path: ./frontend/.env.local
        required: false
      - path: ./frontend/.env
        required: false
      - path: .env.local
        required: false
      - path: .env
        required: false
